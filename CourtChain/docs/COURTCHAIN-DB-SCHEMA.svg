<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1040" viewBox="0 0 1500 1040" role="img" aria-labelledby="title desc">
<title id="title">CourtChain database schema for UC51 to UC55</title><desc id="desc">Five tables: Users, Facilities, Courts, Policies and Audits. Courts belong to Facilities; facility pricing policies optionally refer to Facilities. Audits reference actors and entity IDs by convention, without foreign keys.</desc>
<defs><style><![CDATA[
 text{font-family:Segoe UI,Arial,sans-serif;fill:#18324b}.title{font-size:32px;font-weight:700}.sub{font-size:16px;fill:#5b7187}.head{fill:white;font-size:21px;font-weight:700}.row{font-size:15px}.small{font-size:13px;fill:#60778c}.pk{fill:#d7951c;font-weight:700}.fk{fill:#1557b8;font-weight:700}.line{stroke:#50799c;stroke-width:3;fill:none}.dashed{stroke-dasharray:8 6}.box{fill:white;stroke:#bfd0e0;stroke-width:2}.separator{stroke:#e3ebf2}.pill{fill:#e9f2ff}
 ]]></style><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#50799c" stroke-width="2"/></marker></defs>
<rect width="1500" height="1040" fill="#f5f8fc"/><text x="60" y="64" class="title">CourtChain · Database schema</text><text x="60" y="92" class="sub">Local demo for UC51–UC55 · EF Core / SQLite · based on InitialCreate migration</text>
<!-- connectors behind cards -->
<path d="M510 550 H580 V363 H635" class="line" marker-end="url(#arrow)"/><text x="525" y="309" class="small">1 facility → many courts</text>
<path d="M510 660 H575 V777 H635" class="line" marker-end="url(#arrow)"/><text x="525" y="725" class="small">0..many facility policies</text>
<path d="M460 270 H550 V224 H1250 V250" class="line dashed" marker-end="url(#arrow)"/><text x="699" y="215" class="small">ActorId: logical actor reference</text>
<!-- users -->
<rect x="60" y="160" width="400" height="265" rx="14" class="box"/><path d="M74 160 H446 Q460 160 460 174 V212 H60 V174 Q60 160 74 160" fill="#264b70"/><text x="82" y="194" class="head">Users</text>
<text x="82" y="242" class="row pk">PK  Id : INTEGER</text><text x="82" y="274" class="row">Email : TEXT</text><text x="82" y="306" class="row">Role : TEXT</text><text x="82" y="338" class="row">Salt : TEXT</text><text x="82" y="370" class="row">Hash : TEXT</text><text x="82" y="403" class="small">Development owner login; PBKDF2 password hash</text>
<!-- facilities -->
<rect x="60" y="465" width="450" height="490" rx="14" class="box"/><path d="M74 465 H496 Q510 465 510 479 V517 H60 V479 Q60 465 74 465" fill="#155e75"/><text x="82" y="499" class="head">Facilities</text>
<text x="82" y="547" class="row pk">PK  Id : INTEGER</text><text x="82" y="578" class="row">Name : TEXT <tspan class="small">(unique)</tspan></text><text x="82" y="609" class="row">Address, CityDistrict : TEXT</text><text x="82" y="640" class="row">Phone, Email : TEXT</text><text x="82" y="671" class="row">Opening, Closing : TIME</text><text x="82" y="702" class="row">SlotMinutes : INTEGER</text><text x="82" y="733" class="row">Parking, Shower, ProShop, Wifi : BOOL</text><text x="82" y="764" class="row">Latitude, Longitude : DECIMAL?</text><text x="82" y="795" class="row">Status : TEXT</text><text x="82" y="826" class="row">UpdatedAt : DATETIME · Version : INTEGER</text><line x1="82" x2="488" y1="850" y2="850" class="separator"/><text x="82" y="877" class="small">ImageUrl : TEXT? · UC51 / UC52</text><text x="82" y="906" class="small">UNIQUE (Name)</text>
<!-- courts -->
<rect x="635" y="250" width="405" height="365" rx="14" class="box"/><path d="M649 250 H1026 Q1040 250 1040 264 V302 H635 V264 Q635 250 649 250" fill="#255996"/><text x="657" y="284" class="head">Courts</text>
<text x="657" y="332" class="row pk">PK  Id : INTEGER</text><text x="657" y="363" class="row fk">FK  FacilityId → Facilities.Id</text><text x="657" y="394" class="row">Name, Sport, Surface : TEXT</text><text x="657" y="425" class="row">Indoor, Lighting : BOOL</text><text x="657" y="456" class="row">Notes : TEXT?</text><text x="657" y="487" class="row">Status : TEXT</text><text x="657" y="518" class="row">UpdatedAt : DATETIME · Version : INTEGER</text><line x1="657" x2="1018" y1="542" y2="542" class="separator"/><text x="657" y="570" class="small">UC53 Register Court · UC54 Update Court</text><text x="657" y="596" class="small">UNIQUE (FacilityId, Name)</text>
<!-- policies -->
<rect x="635" y="665" width="405" height="290" rx="14" class="box"/><path d="M649 665 H1026 Q1040 665 1040 679 V717 H635 V679 Q635 665 649 665" fill="#5c4d9d"/><text x="657" y="699" class="head">Policies</text>
<text x="657" y="746" class="row pk">PK  Id : INTEGER</text><text x="657" y="777" class="row fk">FK  FacilityId? → Facilities.Id</text><text x="657" y="808" class="row">Name, Scope, Sport, Status : TEXT</text><text x="657" y="839" class="row">Regular, Peak, Weekend, Discount : DECIMAL</text><text x="657" y="870" class="row">PeakStart, PeakEnd : TIME</text><text x="657" y="901" class="row">EffectiveStart, EffectiveEnd? : DATE</text><text x="657" y="933" class="small">UC55 · Facility scope uses FK; Chain scope uses NULL</text>
<!-- audits -->
<rect x="1080" y="250" width="360" height="365" rx="14" class="box"/><path d="M1094 250 H1426 Q1440 250 1440 264 V302 H1080 V264 Q1080 250 1094 250" fill="#866537"/><text x="1102" y="284" class="head">Audits</text>
<text x="1102" y="332" class="row pk">PK  Id : INTEGER</text><text x="1102" y="363" class="row">Entity, Action : TEXT</text><text x="1102" y="394" class="row">EntityId : INTEGER</text><text x="1102" y="425" class="row">ActorId : INTEGER</text><text x="1102" y="456" class="row">At : DATETIME</text><text x="1102" y="487" class="row">Before : JSON?</text><text x="1102" y="518" class="row">After : JSON</text><line x1="1102" x2="1418" y1="542" y2="542" class="separator"/><text x="1102" y="572" class="small">Rationale : TEXT · logical references only</text>
<rect x="1080" y="665" width="360" height="152" rx="14" fill="#e9f2ff"/><text x="1102" y="699" class="row" font-weight="700">Legend</text><text x="1102" y="730" class="row pk">PK  Primary key</text><text x="1102" y="759" class="row fk">FK  Foreign key</text><text x="1102" y="788" class="small">? = nullable · dashed = logical link</text>
<text x="60" y="1005" class="small">Diagram reflects the implemented migration, not the full conceptual model in the course report.</text>
</svg>

